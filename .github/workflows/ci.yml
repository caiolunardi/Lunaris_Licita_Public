name: Public snapshot CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (full reachable history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
        with:
          redact: true

  tests:
    name: Automated tests and UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install root test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund
      - name: JavaScript and Workerd tests
        run: npm run test:node
      - name: Generate SQL fixtures
        run: node tools/emit-r7-sql-fixtures.mjs "$RUNNER_TEMP/r7_statements.json"
      - name: SQLite and migration tests
        run: python -m unittest discover -s tests -v
        env:
          R7_SQL_FIXTURE: ${{ runner.temp }}/r7_statements.json
      - name: Install UI dependencies
        run: npm ci --prefix web/ui --no-audit --no-fund
      - name: Typecheck, UI tests, and production build
        run: npm run check --prefix web/ui
