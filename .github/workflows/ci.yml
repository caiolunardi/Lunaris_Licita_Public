name: Public snapshot CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (full reachable history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
        with:
          redact: true

  tests:
    name: Automated tests and UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install root test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund
      - name: JavaScript, Workerd and A0 candidate tests
        run: npm run test:node
      - name: Static bootstrap and HML safety gates
        run: |
          node tools/check-e5-static.mjs
          node tools/check-hml-isolation.mjs
      - name: Enforce laboratory-only Cloudflare configuration
        run: node tools/check-lab-safety.mjs
      - name: A0 candidate isolation and offline bundles
        run: |
          node tools/check-public-a0-candidate.mjs
          node --check web/src/hml/a1-candidate.mjs
          node --check web/src/hml/a2-candidate.mjs
          node --check web/src/hml/a3-candidate.mjs
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_API_TOKEN
          mkdir -p "$RUNNER_TEMP/a0-a1" "$RUNNER_TEMP/a0-a2"
          npx wrangler deploy --dry-run --config tests/wrangler-a1-hml-dryrun.jsonc --outdir "$RUNNER_TEMP/a0-a1"
          npx wrangler deploy --dry-run --config tests/wrangler-a2-hml-dryrun.jsonc --outdir "$RUNNER_TEMP/a0-a2"
      - name: Generate SQL fixtures
        run: node tools/emit-r7-sql-fixtures.mjs "$RUNNER_TEMP/r7_statements.json"
      - name: SQLite and migration tests
        run: python -m unittest discover -s tests -v
        env:
          R7_SQL_FIXTURE: ${{ runner.temp }}/r7_statements.json
      - name: Install UI dependencies
        run: npm ci --prefix web/ui --no-audit --no-fund
      - name: Typecheck, UI tests, and production build
        run: npm run check --prefix web/ui
      - name: Wrangler lab and HML dry-runs (no deployment)
        run: |
          npx wrangler deploy --dry-run --config wrangler.jsonc
          npx wrangler deploy --dry-run --config wrangler.hml.jsonc
